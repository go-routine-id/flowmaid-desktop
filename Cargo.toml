[package]
name = "flowmaid-desktop"
version = "0.6.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/go-routine-id/flowmaid-desktop"
publish = false # demo app — run from source

[dependencies]
# Engine diagram; markmaid menarik versi yang sama → tipe terunifikasi.
flowmaid = "0.24"
# Fitur default dipertahankan: accesskit TIDAK dibuang — pohon
# aksesibilitasnya lazy (baru dibangun saat screen reader terhubung),
# jadi biaya runtime-nya ~nol sedangkan membuangnya mematikan
# VoiceOver/NVDA (temuan verifikasi audit memory).
eframe = { version = "0.29", features = ["persistence"] }
rfd = "0.17.2"
# Mesin render Markdown (parse + layout → DocScene). Dipakai dari repo
# markmaid via git supaya CI flowmaid-desktop bisa build tanpa path sibling.
# Untuk co-development lokal, override dengan:
#   [patch."https://github.com/go-routine-id/markmaid"]
#   markmaid = { path = "../markmaid" }
markmaid = { git = "https://github.com/go-routine-id/markmaid" }

# Rampingkan binary release dan bantu inlining lintas-crate.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
